# CDT 流量守护 · Cloudflare Workers 配置
#
# 部署步骤见 README.md。这里只管「运行时需要知道什么」。
# 所有密钥**不写在本文件里**（本文件会进 git），
# 一律用 wrangler secret put 写进 Cloudflare 的加密变量。

name = "cdt-guard"
main = "src/index.js"
compatibility_date = "2026-01-01"
workers_dev = true

# ---------------------------------------------------------------------------
# 定时任务
# ---------------------------------------------------------------------------
# 巡检：每 5 分钟一次。为什么是 5 分钟而不是更频繁：
#   流量超标靠的是「累计用量」，变化是渐进的；
#   阿里云接口本身也有频控，太频繁会被限流反而更糟。
#   5 分钟足够在超标后及时止损，成本也在免费额度内。
#
# 日报：每天 UTC 01:00 = 北京时间 09:00。
# 凭据体检：每天 UTC 02:00 = 北京时间 10:00（与日报错开，避免消息挤在一起）。
[triggers]
crons = ["*/5 * * * *", "0 1 * * *", "0 2 * * *"]

# ---------------------------------------------------------------------------
# KV 命名空间：替代本地文件
# ---------------------------------------------------------------------------
# Worker 不能读写磁盘，所有原本存在文件里的东西都搬进 KV：
#   config          配置（机器清单、阈值、Chat ID）
#   state           运行状态（上次告警时间、连续失败次数）
#   traffic_history 流量台账（周报的数据来源）
#   sessions        「最近一次选中的机器」（三级菜单要用）
#
# ⚠️ 部署前必须把下面的 id 换成你自己创建出来的 KV 命名空间 id。
#    命令：wrangler kv namespace create CDT_GUARD_KV
#    它会输出一个 id，粘到这里即可。
[[kv_namespaces]]
binding = "CDT_GUARD_KV"
id = "973666a6ad6f47449301f93f2e19b84d"

# ---------------------------------------------------------------------------
# 环境变量
# ---------------------------------------------------------------------------
# [vars] 里的内容会明文出现在 Cloudflare 后台，**不要放密钥**。
# 下面两项仅作示例存在；真正的令牌与密钥一律用：
#   wrangler secret put TELEGRAM_BOT_TOKEN
#   wrangler secret put WEBHOOK_SECRET
#
# 需要的加密变量（全部用 secret 方式写入）：
#   TELEGRAM_BOT_TOKEN  —— BotFather 给你的机器人令牌
#   WEBHOOK_SECRET      —— 自己编的一串随机字符，会出现在 Webhook 网址里
#   ALIYUN_CONFIG       —— 配置 JSON 字符串（机器清单 / AK / Chat ID）
[vars]
# 建议保持为空，密钥走 secret。

# ---------------------------------------------------------------------------
# 可观测性
# ---------------------------------------------------------------------------
[observability]
enabled = true

# ---------------------------------------------------------------------------
# 本地开发用（wrangler dev 时模拟 KV）
# ---------------------------------------------------------------------------
# 运行 wrangler dev --local 时，KV 会落在 .wrangler/ 目录下，不会污染线上数据。
